[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appssweep"
version = "1.0.0"
description = "A safety-first Fedora storage analyzer and cleanup assistant."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fedora", "storage", "disk-space", "cleanup", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13.0"]

[project.scripts]
appssweep = "appssweep.cli:main"

[tool.setuptools]
packages = ["appssweep"]
